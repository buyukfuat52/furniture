asyncapi: 3.0.0
info:
  title: MobilyaOS Events
  version: 0.1.0
channels:
  projectCreated:
    address: project.created.v1
    messages:
      projectCreated:
        $ref: "#/components/messages/ProjectCreated"
  revisionCreated:
    address: revision.created.v1
    messages:
      revisionCreated:
        $ref: "#/components/messages/RevisionCreated"
  quoteApproved:
    address: quote.approved.v1
    messages:
      quoteApproved:
        $ref: "#/components/messages/QuoteApproved"
  quoteDeliveryAttemptBlocked:
    address: quote.delivery_attempt.blocked.v1
    messages:
      quoteDeliveryAttemptBlocked:
        $ref: "#/components/messages/QuoteDeliveryAttemptBlocked"
  quoteSandboxDeliveryAttemptRecorded:
    address: quote.delivery_attempt.sandbox_recorded.v1
    messages:
      quoteSandboxDeliveryAttemptRecorded:
        $ref: "#/components/messages/QuoteSandboxDeliveryAttemptRecorded"
  quoteSandboxDeliveryAcknowledged:
    address: quote.delivery_acknowledgement.sandbox_acknowledged.v1
    messages:
      quoteSandboxDeliveryAcknowledged:
        $ref: "#/components/messages/QuoteSandboxDeliveryAcknowledged"
  quoteSent:
    address: quote.sent.v1
    messages:
      quoteSent:
        $ref: "#/components/messages/QuoteSent"
operations:
  publishProjectCreated:
    action: send
    channel:
      $ref: "#/channels/projectCreated"
  publishQuoteDeliveryAttemptBlocked:
    action: send
    channel:
      $ref: "#/channels/quoteDeliveryAttemptBlocked"
  publishQuoteSandboxDeliveryAttemptRecorded:
    action: send
    channel:
      $ref: "#/channels/quoteSandboxDeliveryAttemptRecorded"
  publishQuoteSandboxDeliveryAcknowledged:
    action: send
    channel:
      $ref: "#/channels/quoteSandboxDeliveryAcknowledged"
components:
  messages:
    ProjectCreated:
      name: project.created.v1
      payload:
        $ref: "#/components/schemas/CloudEvent"
    RevisionCreated:
      name: revision.created.v1
      payload:
        $ref: "#/components/schemas/CloudEvent"
    QuoteApproved:
      name: quote.approved.v1
      payload:
        $ref: "#/components/schemas/CloudEvent"
    QuoteDeliveryAttemptBlocked:
      name: quote.delivery_attempt.blocked.v1
      summary: Provider boundary blocked an external quote delivery attempt; no quote-sent transition or production package is triggered.
      payload:
        $ref: "#/components/schemas/CloudEvent"
    QuoteSandboxDeliveryAttemptRecorded:
      name: quote.delivery_attempt.sandbox_recorded.v1
      summary: No-secret sandbox provider delivery attempt recorded; no real email, quote-sent transition, or production package is triggered.
      payload:
        $ref: "#/components/schemas/CloudEvent"
    QuoteSandboxDeliveryAcknowledged:
      name: quote.delivery_acknowledgement.sandbox_acknowledged.v1
      summary: Server-owned sandbox acknowledgement recorded for a delivery attempt; quote status remains approved and real quote-sent transition remains deferred.
      payload:
        $ref: "#/components/schemas/CloudEvent"
    QuoteSent:
      name: quote.sent.v1
      summary: Deferred until a real provider acknowledgement workflow can atomically verify external delivery and transition approved quote revisions to sent.
      payload:
        $ref: "#/components/schemas/CloudEvent"
  schemas:
    CloudEvent:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - correlationid
        - causationid
        - companyid
        - actorid
        - data
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          format: uuid
        source:
          type: string
        type:
          type: string
        subject:
          type: string
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        correlationid:
          type: string
        causationid:
          type: string
        companyid:
          type: string
          format: uuid
        actorid:
          type: string
          format: uuid
        data:
          type: object
