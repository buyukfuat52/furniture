openapi: 3.1.0
info:
  title: MobilyaOS Core API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      summary: Core API health
      responses:
        "200":
          description: Service health state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    post:
      summary: Demo login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Demo access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /tenant/current:
    get:
      summary: Current tenant context
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
        "401":
          $ref: "#/components/responses/Problem"
  /demo-seed:
    get:
      summary: Demo company, catalog, customer and project seed data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Demo seed data.
  /customers:
    get:
      summary: List tenant customers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer list.
    post:
      summary: Create customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /projects:
    get:
      summary: List tenant projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      summary: Create draft project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
  /catalog/materials:
    get:
      summary: List tenant panel material SKUs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Material SKU list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaterialSku"
  /revisions/wardrobe:
    post:
      summary: Create deterministic wardrobe quote revision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardrobeConfig"
      responses:
        "201":
          description: Created revision with BOM, edge banding, labor, and cost snapshot.
  /revisions/{revision_id}:
    get:
      summary: Get quote revision snapshot
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote revision.
  /revisions/{revision_id}/quote-document:
    post:
      summary: Generate customer-safe HTML quote document
      description: Generates a draft customer quote document for a mutable revision. The response includes SHA-256, size, formula version, cost_snapshot_id and cost_snapshot_hash metadata; approved or sent revisions reject regeneration.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Generated quote document.
        "403":
          description: Caller role cannot generate quote documents.
        "409":
          description: Revision is immutable.
  /revisions/{revision_id}/approve:
    post:
      summary: Legacy local-demo approval route, deferred for Supabase P9
      description: This legacy Go-demo path is not the active Supabase approval contract. P9 approval finalization is performed only by consuming a bound approval token through the service-role-backed Supabase route, which validates revision version, snapshot hash, document hash, expiry and replay state before approving a draft quote revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved revision.
        "403":
          description: Caller role cannot approve revisions.
        "409":
          description: Revision is already immutable.
  /supabase/approval-tokens/consume:
    post:
      summary: Consume customer approval token and finalize quote approval
      description: Accepts only a strict POST body approval token. The server hashes the token, validates pending approval, expiry, replay state, revision version, current snapshot hash, and frozen document hash, then may transition the quote revision from draft to approved. The response is sanitized and never includes raw tokens, token hashes, tenant internals, storage paths, signed URLs, send state authority, or production package state.
      responses:
        "200":
          description: Approval token accepted and quote approval finalized.
        "409":
          description: Token was replayed or expired; no quote send or production package was triggered.
        "422":
          description: Request body shape was rejected.
  /supabase/quote-revisions/{revision_id}/send-gate:
    get:
      summary: Read quote send-gate status
      description: Returns server-derived send eligibility and blocker metadata for a tenant-scoped quote revision. P13 may report sandbox_delivery_verified after a server-owned sandbox acknowledgement, while real external delivery, quote-sent transition, and production package generation remain unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized send-gate status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSendGate"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
  /supabase/quote-revisions/{revision_id}/artifacts:
    get:
      summary: List stored quote artifacts
      description: Returns sanitized tenant-scoped artifact metadata. The response never includes storage bucket/path values, signed URL internals, raw HTML, provider secrets, or recipient email.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized artifact list.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteArtifact"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
    post:
      summary: Store approved quote HTML artifact
      description: Stores deterministic HTML artifact bytes in private object storage after approved revision, approved approval gate, frozen document, hash, snapshot, content type, size, and idempotency checks. The browser may provide only an idempotency key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized stored artifact metadata.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact:
                    $ref: "#/components/schemas/QuoteArtifact"
        "403":
          description: Caller role cannot store artifacts.
        "409":
          description: Approved revision, approval gate, or artifact binding is not ready.
        "422":
          description: Request body shape was rejected.
  /supabase/quote-revisions/{revision_id}/artifacts/pdf:
    post:
      summary: Generate deterministic quote PDF artifact
      description: Generates and stores a deterministic binary PDF artifact from trusted persisted approved revision, frozen document, cost snapshot, and stored HTML artifact state. The browser may provide only an idempotency key and never provides totals, hashes, status, or storage paths.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized stored PDF artifact metadata.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact:
                    $ref: "#/components/schemas/QuoteArtifact"
        "403":
          description: Caller role cannot generate quote PDF artifacts.
        "409":
          description: Approved revision, frozen document, cost snapshot, approval gate, or source HTML artifact binding is not ready.
        "422":
          description: Request body shape was rejected.
  /supabase/artifacts/{artifact_id}:
    get:
      summary: Read stored quote artifact metadata
      description: Returns sanitized tenant-scoped artifact metadata without storage locators, signed URLs, or raw HTML.
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized artifact metadata.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact:
                    $ref: "#/components/schemas/QuoteArtifact"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped artifact was not found.
  /supabase/artifacts/{artifact_id}/download:
    get:
      summary: Download stored quote artifact
      description: Serves a private stored quote HTML or PDF artifact through an authenticated server-mediated route after SHA-256 verification. No storage path or signed URL is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML or PDF artifact attachment.
          content:
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped artifact was not found.
  /supabase/quote-revisions/{revision_id}/send-intents:
    get:
      summary: List audited quote send intents
      description: Returns sanitized tenant-scoped send-intent records without provider secrets, recipient email, provider responses, or send-state authority.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized send-intent list.
          content:
            application/json:
              schema:
                type: object
                required: [send_intents]
                properties:
                  send_intents:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteSendIntent"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
    post:
      summary: Prepare audited quote send intent
      description: Creates or reuses a non-delivering send intent after approved revision and stored HTML artifact binding. External delivery, quote-sent state, and production-package creation remain disabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized send intent.
          content:
            application/json:
              schema:
                type: object
                required: [send_intent]
                properties:
                  send_intent:
                    $ref: "#/components/schemas/QuoteSendIntent"
        "403":
          description: Caller role cannot prepare send intents.
        "409":
          description: Approved revision or stored artifact binding is not ready.
        "422":
          description: Request body shape was rejected.
  /supabase/quote-revisions/{revision_id}/delivery-outbox:
    get:
      summary: List provider-safe delivery outbox records
      description: Returns sanitized tenant-scoped delivery outbox records. P13 keeps the delivery outbox provider-deferred with a disabled real-provider adapter and never exposes provider message IDs, provider responses, recipient email, or secrets.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized delivery outbox list.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_outbox]
                properties:
                  delivery_outbox:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteDeliveryOutbox"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
    post:
      summary: Prepare provider-deferred quote delivery outbox record
      description: Creates or reuses an audited internal delivery outbox record only after approved revision, send-intent, and stored PDF artifact binding. With no configured provider, no email is sent and the quote is not marked sent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized provider-deferred outbox record.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_outbox]
                properties:
                  delivery_outbox:
                    $ref: "#/components/schemas/QuoteDeliveryOutbox"
        "403":
          description: Caller role cannot prepare delivery outbox records.
        "409":
          description: Approved revision, send intent, or PDF artifact binding is not ready.
        "422":
          description: Request body shape was rejected.
  /supabase/quote-revisions/{revision_id}/provider-status:
    get:
      summary: Read provider configuration boundary status
      description: Returns sanitized tenant-scoped provider boundary status. P13 exposes a no-secret sandbox provider adapter and sandbox acknowledgement booleans only. Real external delivery and quote-sent transition remain disabled until a verified real provider acknowledgement workflow is implemented.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized provider status.
          content:
            application/json:
              schema:
                type: object
                required: [provider_status]
                properties:
                  provider_status:
                    $ref: "#/components/schemas/QuoteProviderStatus"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
  /supabase/quote-revisions/{revision_id}/delivery-attempts:
    get:
      summary: List quote delivery attempt ledger records
      description: Returns sanitized append-only delivery attempt records. P13 can record sandbox delivery attempts and acknowledged sandbox attempts, but never exposes provider message IDs, raw provider payloads, acknowledgement hashes, recipient email, sent timestamps, or secrets.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized delivery attempt list.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_attempts]
                properties:
                  delivery_attempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteDeliveryAttempt"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
    post:
      summary: Record a sandbox delivery attempt
      description: Records or reuses a no-secret sandbox provider delivery attempt after approved revision, delivery outbox, send intent, PDF artifact, frozen document, and approval-gate binding. It does not send real email, does not mark the quote sent, and does not trigger production.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized sandbox delivery attempt.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_attempt]
                properties:
                  delivery_attempt:
                    $ref: "#/components/schemas/QuoteDeliveryAttempt"
        "403":
          description: Caller role cannot record delivery attempts.
        "409":
          description: Provider boundary, outbox, send-intent, PDF artifact, or approval binding is not ready.
        "422":
          description: Request body shape was rejected.
  /supabase/quote-revisions/{revision_id}/delivery-acknowledgements:
    get:
      summary: List sandbox delivery acknowledgements
      description: Returns sanitized tenant-scoped sandbox acknowledgement records. Responses omit acknowledgement hashes, raw provider payloads, provider secrets, recipient data, storage paths, signed URLs, and sent timestamps.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized delivery acknowledgement list.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_acknowledgements]
                properties:
                  delivery_acknowledgements:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteDeliveryAcknowledgement"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
  /supabase/delivery-attempts/{delivery_attempt_id}/sandbox-acknowledgement:
    post:
      summary: Record server-owned sandbox delivery acknowledgement
      description: Records a durable sandbox acknowledgement for the current tenant-scoped sandbox delivery attempt. The browser may provide only an idempotency key; acknowledgement state, hashes, provider metadata, recipient, sent_at, and quote status are derived server-side.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: delivery_attempt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized sandbox delivery acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_acknowledgement]
                properties:
                  delivery_acknowledgement:
                    $ref: "#/components/schemas/QuoteDeliveryAcknowledgement"
        "403":
          description: Caller role cannot acknowledge sandbox delivery.
        "404":
          description: Tenant-scoped delivery attempt was not found.
        "409":
          description: Sandbox acknowledgement was replayed, stale, duplicate, or not bound to the current attempt.
        "422":
          description: Request body shape was rejected.
  /revisions/{revision_id}/fork:
    post:
      summary: Fork a quote revision and apply deterministic config patch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Forked revision.
  /revisions/{left_revision_id}/diff/{right_revision_id}:
    get:
      summary: Structured revision diff
      security:
        - bearerAuth: []
      parameters:
        - name: left_revision_id
          in: path
          required: true
          schema:
            type: string
        - name: right_revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Structured diff.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    Problem:
      description: Structured problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in_seconds, user, company_id]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in_seconds:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        company_id:
          type: string
          format: uuid
    User:
      type: object
      required: [id, company_id, email, roles]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum: [admin, sales, designer, costing, procurement, production, viewer]
    TenantContext:
      type: object
      required: [company_id, actor_id, roles]
      properties:
        company_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
    Project:
      type: object
      required: [id, company_id, customer_name, name, status, version]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        customer_name:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        version:
          type: integer
    Customer:
      type: object
      required: [id, company_id, name, version]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        version:
          type: integer
    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        name:
          type: string
          minLength: 1
    MaterialSku:
      type: object
      required: [id, company_id, sku, name, thickness_mm, sheet_width_mm, sheet_height_mm]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        thickness_mm:
          type: integer
        sheet_width_mm:
          type: integer
        sheet_height_mm:
          type: integer
        price_per_sheet:
          $ref: "#/components/schemas/MoneyMinor"
    WardrobeConfig:
      type: object
      required: [project_id, quantity, width_mm, height_mm, depth_mm, material_sku, edge_band_sku, shelf_count, door_count, markup_bps, vat_bps]
      properties:
        project_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        width_mm:
          type: integer
        height_mm:
          type: integer
        depth_mm:
          type: integer
        material_sku:
          type: string
        edge_band_sku:
          type: string
        shelf_count:
          type: integer
        door_count:
          type: integer
        markup_bps:
          type: integer
        vat_bps:
          type: integer
    QuoteSendGate:
      type: object
      required:
        - revision_id
        - quote_status
        - status
        - eligible_to_send
        - eligible_to_prepare_send
        - eligible_to_prepare_delivery
        - eligible_to_record_delivery_attempt
        - approved_revision
        - frozen_document_bound
        - document_hash_bound
        - snapshot_hash_bound
        - artifact_bound
        - pdf_artifact_bound
        - email_provider_configured
        - latest_send_intent_status
        - latest_delivery_outbox_status
        - latest_delivery_attempt_status
        - latest_delivery_acknowledgement_status
        - provider_status
        - provider_configured
        - real_delivery_enabled
        - sandbox_delivery_enabled
        - sandbox_delivery_verified
        - sent_transition_enabled
        - provider_acknowledgement_verified
        - sandbox_acknowledgement_verified
        - quote_status_changed_by_sandbox
        - quote_status_after_sandbox
        - quote_send_triggered
        - production_package_triggered
        - artifact_status
        - blocking_reasons
        - deferred_actions
      properties:
        revision_id:
          type: string
          format: uuid
        quote_status:
          type: string
        status:
          type: string
