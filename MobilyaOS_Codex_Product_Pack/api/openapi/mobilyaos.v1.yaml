openapi: 3.1.0
info:
  title: MobilyaOS Core API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      summary: Core API health
      responses:
        "200":
          description: Service health state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    post:
      summary: Demo login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Demo access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /tenant/current:
    get:
      summary: Current tenant context
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
        "401":
          $ref: "#/components/responses/Problem"
  /demo-seed:
    get:
      summary: Demo company, catalog, customer and project seed data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Demo seed data.
  /customers:
    get:
      summary: List tenant customers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer list.
    post:
      summary: Create customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /projects:
    get:
      summary: List tenant projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      summary: Create draft project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
  /catalog/materials:
    get:
      summary: List tenant panel material SKUs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Material SKU list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaterialSku"
  /revisions/wardrobe:
    post:
      summary: Create deterministic wardrobe quote revision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardrobeConfig"
      responses:
        "201":
          description: Created revision with BOM, edge banding, labor, and cost snapshot.
  /revisions/{revision_id}:
    get:
      summary: Get quote revision snapshot
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote revision.
  /revisions/{revision_id}/quote-document:
    post:
      summary: Generate customer-safe HTML quote document
      description: Generates a draft customer quote document for a mutable revision. The response includes SHA-256, size, formula version, cost_snapshot_id and cost_snapshot_hash metadata; approved or sent revisions reject regeneration.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Generated quote document.
        "403":
          description: Caller role cannot generate quote documents.
        "409":
          description: Revision is immutable.
  /revisions/{revision_id}/approve:
    post:
      summary: Legacy local-demo approval route, deferred for Supabase P9
      description: This legacy Go-demo path is not the active Supabase approval contract. P9 approval finalization is performed only by consuming a bound approval token through the service-role-backed Supabase route, which validates revision version, snapshot hash, document hash, expiry and replay state before approving a draft quote revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved revision.
        "403":
          description: Caller role cannot approve revisions.
        "409":
          description: Revision is already immutable.
  /supabase/approval-tokens/consume:
    post:
      summary: Consume customer approval token and finalize quote approval
      description: Accepts only a strict POST body approval token. The server hashes the token, validates pending approval, expiry, replay state, revision version, current snapshot hash, and frozen document hash, then may transition the quote revision from draft to approved. The response is sanitized and never includes raw tokens, token hashes, tenant internals, storage paths, signed URLs, send state authority, or production package state.
      responses:
        "200":
          description: Approval token accepted and quote approval finalized.
        "409":
          description: Token was replayed or expired; no quote send or production package was triggered.
        "422":
          description: Request body shape was rejected.
  /supabase/quote-revisions/{revision_id}/send-gate:
    get:
      summary: Read quote send-gate status
      description: Returns server-derived send eligibility and blocker metadata for a tenant-scoped quote revision. P10 reports stored-artifact and send-intent preparation state, while external send, binary PDF, and production package generation remain unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized send-gate status.
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
  /supabase/quote-revisions/{revision_id}/artifacts:
    get:
      summary: List stored quote artifacts
      description: Returns sanitized tenant-scoped artifact metadata. The response never includes storage bucket/path values, signed URL internals, raw HTML, provider secrets, or recipient email.
      security:
        - bearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized artifact list.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteArtifact"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped quote revision was not found.
    post:
      summary: Store approved quote HTML artifact
      description: Stores deterministic HTML artifact bytes in private object storage after approved revision, approved approval gate, frozen document, hash, snapshot, content type, size, and idempotency checks. The browser may provide only an idempotency key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized stored artifact metadata.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact:
                    $ref: "#/components/schemas/QuoteArtifact"
        "403":
          description: Caller role cannot store artifacts.
        "409":
          description: Approved revision, approval gate, or artifact binding is not ready.
        "422":
          description: Request body shape was rejected.
  /supabase/artifacts/{artifact_id}:
    get:
      summary: Read stored quote artifact metadata
      description: Returns sanitized tenant-scoped artifact metadata without storage locators, signed URLs, or raw HTML.
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized artifact metadata.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact:
                    $ref: "#/components/schemas/QuoteArtifact"
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped artifact was not found.
  /supabase/artifacts/{artifact_id}/download:
    get:
      summary: Download stored quote HTML artifact
      description: Serves the private stored HTML artifact through an authenticated server-mediated route after SHA-256 verification. No storage path or signed URL is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML artifact attachment.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Session required.
        "404":
          description: Tenant-scoped artifact was not found.
  /supabase/quote-revisions/{revision_id}/send-intents:
    post:
      summary: Prepare audited quote send intent
      description: Creates a non-delivering send intent after approved revision and stored-artifact binding. External delivery, quote-sent state, binary PDF finalization, and production-package creation remain disabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Sanitized send intent.
          content:
            application/json:
              schema:
                type: object
                required: [send_intent]
                properties:
                  send_intent:
                    $ref: "#/components/schemas/QuoteSendIntent"
        "403":
          description: Caller role cannot prepare send intents.
        "409":
          description: Approved revision or stored artifact binding is not ready.
        "422":
          description: Request body shape was rejected.
  /revisions/{revision_id}/fork:
    post:
      summary: Fork a quote revision and apply deterministic config patch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Forked revision.
  /revisions/{left_revision_id}/diff/{right_revision_id}:
    get:
      summary: Structured revision diff
      security:
        - bearerAuth: []
      parameters:
        - name: left_revision_id
          in: path
          required: true
          schema:
            type: string
        - name: right_revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Structured diff.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    Problem:
      description: Structured problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in_seconds, user, company_id]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in_seconds:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        company_id:
          type: string
          format: uuid
    User:
      type: object
      required: [id, company_id, email, roles]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum: [admin, sales, designer, costing, procurement, production, viewer]
    TenantContext:
      type: object
      required: [company_id, actor_id, roles]
      properties:
        company_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
    Project:
      type: object
      required: [id, company_id, customer_name, name, status, version]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        customer_name:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        version:
          type: integer
    Customer:
      type: object
      required: [id, company_id, name, version]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        version:
          type: integer
    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        name:
          type: string
          minLength: 1
    MaterialSku:
      type: object
      required: [id, company_id, sku, name, thickness_mm, sheet_width_mm, sheet_height_mm]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        thickness_mm:
          type: integer
        sheet_width_mm:
          type: integer
        sheet_height_mm:
          type: integer
        price_per_sheet:
          $ref: "#/components/schemas/MoneyMinor"
    WardrobeConfig:
      type: object
      required: [project_id, quantity, width_mm, height_mm, depth_mm, material_sku, edge_band_sku, shelf_count, door_count, markup_bps, vat_bps]
      properties:
        project_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        width_mm:
          type: integer
        height_mm:
          type: integer
        depth_mm:
          type: integer
        material_sku:
          type: string
        edge_band_sku:
          type: string
        shelf_count:
          type: integer
        door_count:
          type: integer
        markup_bps:
          type: integer
        vat_bps:
          type: integer
    QuoteArtifact:
      type: object
      required:
        - id
        - revision_id
        - generated_document_id
        - artifact_type
        - status
        - content_type
        - sha256
        - size_bytes
        - artifact_version
        - renderer_version
        - revision_version
        - snapshot_hash
        - source_document_hash
        - pdf_status
        - storage_status
        - access_model
        - signed_url_returned
        - external_url_generated
        - deferred_actions
      properties:
        id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
        generated_document_id:
          type: string
          format: uuid
        cost_snapshot_id:
          type: string
          format: uuid
        artifact_type:
          type: string
          enum: [quote_html_storage, quote_pdf]
        status:
          type: string
          enum: [stored, metadata_recorded, failed]
        content_type:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
        artifact_version:
          type: string
        renderer_version:
          type: string
        revision_version:
          type: integer
        snapshot_hash:
          type: string
        source_document_hash:
          type: string
        pdf_status:
          type: string
          enum: [deferred, generated]
        storage_status:
          type: string
          enum: [object_stored]
        access_model:
          type: string
          enum: [server_mediated_download]
        signed_url_returned:
          type: boolean
          const: false
        external_url_generated:
          type: boolean
          const: false
        created_at:
          type: string
        deferred_actions:
          type: array
          items:
            type: string
    QuoteSendIntent:
      type: object
      required:
        - id
        - revision_id
        - artifact_id
        - generated_document_id
        - status
        - provider_status
        - recipient_source
        - recipient_available
        - email_provider_configured
        - external_delivery_attempted
        - quote_sent
        - production_package_triggered
        - send_version
        - deferred_actions
      properties:
        id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        generated_document_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [send_prepared, send_deferred, send_blocked]
        provider_status:
          type: string
          enum: [provider_missing, not_attempted]
        recipient_source:
          type: string
          enum: [project_customer, missing_customer_email]
        recipient_available:
          type: boolean
        email_provider_configured:
          type: boolean
          const: false
        external_delivery_attempted:
          type: boolean
          const: false
        quote_sent:
          type: boolean
          const: false
        production_package_triggered:
          type: boolean
          const: false
        send_version:
          type: string
        created_at:
          type: string
        deferred_actions:
          type: array
          items:
            type: string
    MoneyMinor:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
    Problem:
      type: object
      required: [type, title, status, code, detail, trace_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        trace_id:
          type: string
