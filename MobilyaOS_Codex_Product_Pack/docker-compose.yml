services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mobilia
      POSTGRES_USER: mobilia
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilia -d mobilia"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: mobilia_dev_only
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_ROOT_PASSWORD:-}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      APP_ENV: development
      CORE_ADDR: ":8080"
      DATABASE_URL: ${LOCAL_DOCKER_DATABASE_URL:-}
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mobilia-dev
      S3_ACCESS_KEY: ${LOCAL_MINIO_ACCESS_KEY:-}
      S3_SECRET_KEY: ${LOCAL_MINIO_SECRET_KEY:-}
      DEMO_SEED_PASSWORD: Demo1234!ChangeMe
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started

  compute:
    build:
      context: .
      dockerfile: services/compute/Dockerfile
    environment:
      APP_ENV: development
      COMPUTE_HOST: 0.0.0.0
      COMPUTE_PORT: "8090"
      MODEL_PROVIDER: disabled
      CORE_BASE_URL: http://core:8080
    ports:
      - "8090:8090"
    depends_on:
      - core

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_COMPUTE_BASE_URL: http://localhost:8090
    ports:
      - "3000:3000"
    depends_on:
      - core
      - compute

volumes:
  postgres_data:
  minio_data:
